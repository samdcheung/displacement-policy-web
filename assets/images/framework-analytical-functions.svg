<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Three analytical functions</title>
<desc id="desc">Displacement Continuum, Sustainable Inclusion and Political Economy shown as three connected analytical functions.</desc>
