<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" fill="none">
  <defs>
    <style><![CDATA[
      .bg { fill: #F5F2EB; }
      .ink { fill: #0E2940; }
      .muted { fill: #536472; }
      .bronze { fill: #B8872B; }
      .line { stroke: #CFC8BA; stroke-width: 1.5; }
      .dash { stroke: #9FAAB1; stroke-width: 2; stroke-dasharray: 8 8; }
      .navy-stroke { stroke: #0E2940; }
      .bronze-stroke { stroke: #B8872B; }
      .soft-tan { fill: #E8DDCA; }
      .soft-blue { fill: #D7E0E2; }
      .soft-sage { fill: #D8E2DD; }
      .eyebrow { font: 700 24px Inter, Arial, sans-serif; letter-spacing: 0.16em; }
      .title { font: 400 72px Georgia, 'Times New Roman', serif; }
      .subtitle { font: italic 400 28px Georgia, 'Times New Roman', serif; }
      .section { font: 700 16px Inter, Arial, sans-serif; letter-spacing: 0.16em; }
      .h2 { font: 400 34px Georgia, 'Times New Roman', serif; }
      .body { font: 400 24px Inter, Arial, sans-serif; }
      .small { font: 400 20px Inter, Arial, sans-serif; }
      .tiny { font: 400 18px Inter, Arial, sans-serif; }
      .label { font: 700 14px Inter, Arial, sans-serif; letter-spacing: 0.12em; }
    ]]></style>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.04"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06253A"/>
      <stop offset="1" stop-color="#0A304A"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L12,7 L0,14" fill="none" stroke="#0E2940" stroke-width="2"/>
    </marker>
  </defs>

  <rect width="1440" height="860" class="bg" filter="url(#paper)"/>
  <rect width="1440" height="92" fill="url(#headerGrad)"/>

  <!-- top contour decoration -->
  <g opacity="0.75">
    <path d="M0 36 C130 10 230 72 360 34 C490 -4 588 72 706 36 C828 0 930 62 1048 34 C1166 6 1268 72 1440 24" stroke="#C08B2F" stroke-width="1.5" fill="none" stroke-dasharray="3 6"/>
    <path d="M0 56 C140 28 248 82 372 52 C508 20 610 82 730 52 C850 24 944 80 1068 54 C1186 30 1298 82 1440 48" stroke="#7BA0B1" stroke-width="1.3" fill="none"/>
    <circle cx="174" cy="43" r="5" fill="#C08B2F"/>
    <circle cx="612" cy="51" r="4" fill="#D9D6CE"/>
    <circle cx="1110" cy="40" r="4" fill="#C08B2F"/>
  </g>

  <!-- title block -->
  <text x="84" y="176" class="eyebrow bronze">FRAMEWORK</text>
  <line x1="84" y1="194" x2="132" y2="194" stroke="#B8872B" stroke-width="3"/>
  <text x="84" y="274" class="title ink">The Displacement Continuum</text>
  <text x="84" y="336" class="subtitle ink">Displacement is lived continuously,</text>
  <text x="84" y="378" class="subtitle ink">while governance responsibility fragments</text>
  <text x="84" y="420" class="subtitle ink">at institutional thresholds.</text>

  <!-- right contour decoration -->
  <g opacity="0.45">
    <path d="M1040 154 C1140 124 1220 204 1346 154" stroke="#D7CCBA" stroke-width="1.4" fill="none"/>
    <path d="M1002 178 C1118 146 1202 224 1340 178" stroke="#D7CCBA" stroke-width="1.4" fill="none"/>
    <path d="M970 202 C1098 170 1188 248 1328 202" stroke="#D7CCBA" stroke-width="1.4" fill="none"/>
    <path d="M944 226 C1078 192 1172 272 1316 228" stroke="#D7CCBA" stroke-width="1.4" fill="none"/>
    <path d="M926 252 C1064 216 1160 296 1306 252" stroke="#D7CCBA" stroke-width="1.4" fill="none"/>
    <path d="M1024 165 C1126 130 1210 208 1344 162" stroke="#A0A8AE" stroke-width="1.6" fill="none" stroke-dasharray="4 5"/>
    <circle cx="1088" cy="201" r="5" fill="#B8872B"/>
    <circle cx="1176" cy="180" r="4" fill="#A0A8AE"/>
    <circle cx="1260" cy="214" r="4" fill="#B8872B"/>
    <circle cx="1314" cy="198" r="4" fill="#A0A8AE"/>
  </g>

  <!-- central diagram background bands -->
  <path d="M200 530 C350 492 510 586 640 542 C760 500 874 580 992 548 C1108 518 1204 584 1322 552 L1322 726 L200 726 Z" class="soft-tan" opacity="0.75"/>
  <path d="M200 560 C346 520 520 610 654 564 C784 520 894 610 1018 572 C1138 536 1228 600 1322 566 L1322 726 L200 726 Z" class="soft-blue" opacity="0.72"/>
  <path d="M200 594 C356 550 508 636 654 592 C780 554 910 632 1034 598 C1168 562 1250 620 1322 606 L1322 726 L200 726 Z" class="soft-sage" opacity="0.72"/>

  <!-- continuum lines -->
  <g>
    <path d="M200 620 C350 578 506 658 648 620 C786 584 908 656 1044 620 C1162 588 1258 634 1370 626" stroke="#0E2940" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
    <path d="M200 612 C350 570 506 650 648 612 C786 576 908 648 1044 612 C1162 580 1258 626 1370 618" stroke="#29536A" stroke-width="5" fill="none"/>
    <path d="M200 628 C350 586 506 666 648 628 C786 592 908 664 1044 628 C1162 596 1258 642 1370 634" stroke="#29536A" stroke-width="5" fill="none"/>
    <path d="M200 605 C350 563 506 643 648 605 C786 569 908 641 1044 605 C1162 573 1258 619 1370 611" stroke="#B8872B" stroke-width="2.2" fill="none" opacity="0.9"/>
    <path d="M200 635 C350 593 506 673 648 635 C786 599 908 671 1044 635 C1162 603 1258 649 1370 641" stroke="#B8872B" stroke-width="2.2" fill="none" opacity="0.9"/>
    <circle cx="270" cy="624" r="6" fill="#C99A3E"/>
    <circle cx="442" cy="610" r="6" fill="#F5F2EB" stroke="#AAB5BA"/>
    <circle cx="548" cy="615" r="6" fill="#F5F2EB" stroke="#AAB5BA"/>
    <circle cx="710" cy="640" r="6" fill="#F5F2EB" stroke="#AAB5BA"/>
    <circle cx="836" cy="615" r="6" fill="#C99A3E"/>
    <circle cx="912" cy="620" r="6" fill="#F5F2EB" stroke="#AAB5BA"/>
    <circle cx="1016" cy="640" r="6" fill="#F5F2EB" stroke="#AAB5BA"/>
    <circle cx="1220" cy="625" r="6" fill="#C99A3E"/>
  </g>

  <!-- left labels -->
  <text x="104" y="580" class="section ink" text-anchor="middle">LIVED</text>
  <text x="104" y="608" class="section ink" text-anchor="middle">CONTINUUM</text>
  <text x="104" y="652" class="tiny muted" text-anchor="middle">People and</text>
  <text x="104" y="680" class="tiny muted" text-anchor="middle">communities</text>
  <text x="104" y="708" class="tiny muted" text-anchor="middle">move, adapt,</text>
  <text x="104" y="736" class="tiny muted" text-anchor="middle">and endure.</text>

  <!-- fault line headers -->
  <g>
    <text x="410" y="480" class="section bronze" text-anchor="middle">FAULT LINE 1</text>
    <text x="410" y="532" class="h2 ink" text-anchor="middle">Categorical</text>
    <circle cx="410" cy="558" r="6" fill="#B8872B"/>
    <line x1="410" y1="564" x2="410" y2="812" class="dash"/>

    <text x="768" y="480" class="section bronze" text-anchor="middle">FAULT LINE 2</text>
    <text x="768" y="532" class="h2 ink" text-anchor="middle">Temporal</text>
    <circle cx="768" cy="558" r="6" fill="#B8872B"/>
    <line x1="768" y1="564" x2="768" y2="812" class="dash"/>

    <text x="1124" y="480" class="section bronze" text-anchor="middle">FAULT LINE 3</text>
    <text x="1124" y="532" class="h2 ink" text-anchor="middle">Territorial</text>
    <circle cx="1124" cy="558" r="6" fill="#B8872B"/>
    <line x1="1124" y1="564" x2="1124" y2="812" class="dash"/>
  </g>

  <!-- governance fragments row -->
  <line x1="54" y1="764" x2="1322" y2="764" class="line"/>
  <text x="54" y="812" class="section ink">GOVERNANCE</text>
  <text x="54" y="840" class="section ink">FRAGMENTS</text>

  <g class="tiny muted" text-anchor="middle">
    <!-- categorical -->
    <circle cx="272" cy="824" r="4" fill="#0E2940"/>
    <text x="272" y="850">status</text>
    <circle cx="350" cy="824" r="4" fill="#0E2940"/>
    <text x="350" y="850">mandate</text>
    <circle cx="438" cy="824" r="4" fill="#0E2940"/>
    <text x="438" y="850">services</text>
    <circle cx="522" cy="824" r="4" fill="#0E2940"/>
    <text x="522" y="850">financing</text>

    <!-- temporal -->
    <circle cx="664" cy="824" r="4" fill="#0E2940"/>
    <text x="664" y="850">time</text>
    <circle cx="736" cy="824" r="4" fill="#0E2940"/>
    <text x="736" y="850">mandate</text>
    <circle cx="816" cy="824" r="4" fill="#0E2940"/>
    <text x="816" y="850">services</text>
    <circle cx="896" cy="824" r="4" fill="#0E2940"/>
    <text x="896" y="850">financing</text>

    <!-- territorial -->
    <circle cx="1028" cy="824" r="4" fill="#0E2940"/>
    <text x="1028" y="850">jurisdiction</text>
    <circle cx="1112" cy="824" r="4" fill="#0E2940"/>
    <text x="1112" y="850">mandate</text>
    <circle cx="1200" cy="824" r="4" fill="#0E2940"/>
    <text x="1200" y="850">services</text>
    <circle cx="1288" cy="824" r="4" fill="#0E2940"/>
    <text x="1288" y="850">financing</text>
  </g>
</svg>
