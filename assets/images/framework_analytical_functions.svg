<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <style><![CDATA[
      .bg { fill: #F5F2EB; }
      .ink { fill: #0E2940; }
      .muted { fill: #536472; }
      .bronze { fill: #B8872B; }
      .line { stroke: #D1CABA; stroke-width: 1.5; }
      .panel { fill: #F8F6F1; stroke: #DDD5C7; stroke-width: 1.5; }
      .thin { stroke: #B8872B; stroke-width: 2; }
      .navy { stroke: #0E2940; }
      .eyebrow { font: 700 24px Inter, Arial, sans-serif; letter-spacing: 0.16em; }
      .title { font: 400 62px Georgia, 'Times New Roman', serif; }
      .section { font: 700 16px Inter, Arial, sans-serif; letter-spacing: 0.16em; }
      .h2 { font: 400 32px Georgia, 'Times New Roman', serif; }
      .body { font: 400 22px Inter, Arial, sans-serif; }
      .small { font: 400 20px Inter, Arial, sans-serif; }
      .label { font: 700 18px Inter, Arial, sans-serif; letter-spacing: 0.14em; }
    ]]></style>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <marker id="arrowB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12" fill="none" stroke="#B8872B" stroke-width="2"/>
    </marker>
  </defs>

  <rect width="1440" height="900" class="bg" filter="url(#paper)"/>

  <text x="88" y="96" class="eyebrow bronze">FRAMEWORK</text>
  <line x1="88" y1="118" x2="136" y2="118" stroke="#B8872B" stroke-width="3"/>
  <text x="88" y="214" class="title ink">An integrated framework</text>
  <text x="88" y="286" class="title ink">for displacement governance</text>

  <line x1="818" y1="96" x2="818" y2="286" class="line"/>
  <text x="878" y="150" class="body muted">Our framework connects diagnosis, design and</text>
  <text x="878" y="196" class="body muted">political analysis to understand why governance</text>
  <text x="878" y="242" class="body muted">fragments — and how more inclusive and</text>
  <text x="878" y="288" class="body muted">durable solutions can be built.</text>

  <line x1="0" y1="360" x2="1440" y2="360" class="line"/>
  <line x1="194" y1="420" x2="608" y2="420" class="line"/>
  <circle cx="176" cy="420" r="5" fill="#B8872B"/>
  <line x1="832" y1="420" x2="1244" y2="420" class="line"/>
  <circle cx="1262" cy="420" r="5" fill="#B8872B"/>
  <text x="720" y="428" class="section ink" text-anchor="middle">ANALYTICAL FUNCTIONS</text>

  <!-- panels -->
  <g>
    <path d="M184 518 C184 456 230 420 332 420 C434 420 480 456 480 518 L480 788 L184 788 Z" class="panel"/>
    <path d="M572 518 C572 456 618 420 720 420 C822 420 868 456 868 518 L868 788 L572 788 Z" class="panel"/>
    <path d="M960 518 C960 456 1006 420 1108 420 C1210 420 1256 456 1256 518 L1256 788 L960 788 Z" class="panel"/>
  </g>

  <!-- circular motifs -->
  <g>
    <circle cx="332" cy="504" r="110" fill="#0B2940"/>
    <path d="M248 474 C286 452 318 504 356 474 C392 446 414 498 426 482" stroke="#A4B0B4" stroke-width="2" fill="none"/>
    <path d="M244 498 C286 474 322 526 358 498 C390 472 418 520 430 504" stroke="#D0A145" stroke-width="2" fill="none"/>
    <path d="M250 520 C286 496 320 548 360 520 C396 494 418 540 428 524" stroke="#A4B0B4" stroke-width="2" fill="none"/>
    <circle cx="272" cy="502" r="7" fill="#F5F2EB" stroke="#A7B0B7"/>
    <circle cx="304" cy="494" r="7" fill="#F5F2EB" stroke="#A7B0B7"/>
    <circle cx="346" cy="504" r="10" fill="none" stroke="#D0A145" stroke-width="4"/>
    <circle cx="384" cy="492" r="7" fill="#F5F2EB" stroke="#A7B0B7"/>
    <circle cx="412" cy="484" r="7" fill="#F5F2EB" stroke="#A7B0B7"/>

    <circle cx="720" cy="504" r="110" fill="#416C7A"/>
    <polygon points="720,428 786,466 786,542 720,580 654,542 654,466" fill="none" stroke="#DAD7CC" stroke-width="2"/>
    <circle cx="720" cy="504" r="54" fill="none" stroke="#D0A145" stroke-width="2" opacity="0.7"/>
    <circle cx="720" cy="504" r="7" fill="#F5F2EB" stroke="#DAD7CC"/>
    <line x1="720" y1="430" x2="720" y2="578" stroke="#DAD7CC" stroke-width="2"/>
    <line x1="654" y1="466" x2="786" y2="542" stroke="#DAD7CC" stroke-width="2"/>
    <line x1="786" y1="466" x2="654" y2="542" stroke="#DAD7CC" stroke-width="2"/>

    <circle cx="1108" cy="504" r="110" fill="#8C9BA2"/>
    <g stroke="#F5F2EB" stroke-width="2.2">
      <line x1="1038" y1="462" x2="1080" y2="484"/>
      <line x1="1080" y1="484" x2="1132" y2="452"/>
      <line x1="1080" y1="484" x2="1100" y2="526"/>
      <line x1="1132" y1="452" x2="1180" y2="486"/>
      <line x1="1100" y1="526" x2="1180" y2="486"/>
      <line x1="1100" y1="526" x2="1142" y2="562"/>
      <line x1="1180" y1="486" x2="1188" y2="540"/>
      <line x1="1142" y1="562" x2="1188" y2="540"/>
      <line x1="1060" y1="548" x2="1100" y2="526"/>
      <line x1="1038" y1="462" x2="1060" y2="548"/>
    </g>
    <circle cx="1038" cy="462" r="8" fill="#D0A145"/>
    <circle cx="1080" cy="484" r="8" fill="#0E2940"/>
    <circle cx="1132" cy="452" r="8" fill="#D0A145"/>
    <circle cx="1100" cy="526" r="8" fill="#F5F2EB"/>
    <circle cx="1180" cy="486" r="8" fill="#0E2940"/>
    <circle cx="1142" cy="562" r="8" fill="#0E2940"/>
    <circle cx="1188" cy="540" r="8" fill="#F5F2EB"/>
    <circle cx="1060" cy="548" r="8" fill="#D0A145"/>
  </g>

  <!-- arrows between -->
  <line x1="498" y1="520" x2="590" y2="520" class="thin" marker-end="url(#arrowB)"/>
  <line x1="886" y1="520" x2="978" y2="520" class="thin" marker-end="url(#arrowB)"/>

  <!-- numbered badges -->
  <g>
    <circle cx="332" cy="574" r="22" fill="#0E2940" stroke="#B8872B"/>
    <text x="332" y="582" class="body" fill="#F5F2EB" text-anchor="middle">1</text>
    <circle cx="720" cy="574" r="22" fill="#355B68" stroke="#B8872B"/>
    <text x="720" y="582" class="body" fill="#F5F2EB" text-anchor="middle">2</text>
    <circle cx="1108" cy="574" r="22" fill="#3E5B67" stroke="#B8872B"/>
    <text x="1108" y="582" class="body" fill="#F5F2EB" text-anchor="middle">3</text>
  </g>

  <!-- text blocks -->
  <g text-anchor="middle">
    <text x="332" y="642" class="h2 ink">Displacement Continuum</text>
    <text x="332" y="678" class="label bronze">GOVERNANCE DIAGNOSTIC</text>
    <line x1="286" y1="696" x2="378" y2="696" class="thin"/>
    <text x="332" y="744" class="small muted">Identifies where responsibility</text>
    <text x="332" y="774" class="small muted">breaks across systems and scales.</text>

    <text x="720" y="642" class="h2 ink">Sustainable Inclusion</text>
    <text x="720" y="678" class="label bronze">DIRECTION OF REFORM</text>
    <line x1="674" y1="696" x2="766" y2="696" class="thin"/>
    <text x="720" y="744" class="small muted">Defines what continuity requires</text>
    <text x="720" y="774" class="small muted">to secure rights, services and</text>
    <text x="720" y="804" class="small muted">opportunities over time.</text>

    <text x="1108" y="642" class="h2 ink">Political Economy</text>
    <text x="1108" y="678" class="label bronze">PERSISTENCE &amp; FEASIBILITY</text>
    <line x1="1062" y1="696" x2="1154" y2="696" class="thin"/>
    <text x="1108" y="744" class="small muted">Explains why fragmentation</text>
    <text x="1108" y="774" class="small muted">persists and what reform</text>
    <text x="1108" y="804" class="small muted">is politically and practically</text>
    <text x="1108" y="834" class="small muted">feasible.</text>
  </g>

  <!-- bottom connector -->
  <g>
    <line x1="332" y1="790" x2="332" y2="826" class="thin"/>
    <line x1="720" y1="790" x2="720" y2="826" class="thin"/>
    <line x1="1108" y1="790" x2="1108" y2="826" class="thin"/>
    <line x1="332" y1="826" x2="1108" y2="826" class="thin"/>
    <line x1="720" y1="826" x2="720" y2="852" class="thin"/>
    <rect x="466" y="852" width="508" height="48" rx="10" stroke="#B8872B" stroke-width="2" fill="#F8F6F1"/>
    <text x="720" y="883" class="label bronze" text-anchor="middle">EVIDENCE IN CONTEXT  •  ITERATIVE LEARNING  •  ADAPTIVE REFORM</text>
  </g>
</svg>
